name: Publish COT report

on:
  schedule:
    # CFTC releases Fridays 3:30 pm ET (holiday weeks slip a day or two), so checking daily catches every release.
    - cron: "0 21 * * *"
    - cron: "0 12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest CFTC report and build the site
        run: python cot_electricity.py --site _site

      - name: Save new week's data to the repo
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: COT report $(ls data | sort | tail -1 | cut -d. -f1)"
            git push
          else
            echo "No new report this run."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
